name: 客户反馈
description: 报告 ProvenLattice 试用中的问题或改进建议（统一回流 issue-pilot）
title: "[feedback] "
labels: ["GRAPH_BUG"]
body:
  - type: input
    id: version
    attributes:
      label: ProvenLattice version
      description: 反馈对应的版本（reported-on）。
      value: "1.6.0"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 反馈分类
      options:
        - Graph Coverage（缺少关系）
        - Graph Correctness（关系错误）
        - Graph Precision（关系过粗）
        - Query Usability（已有图难以直接消费）
        - Scale / Performance（性能或资源问题）
        - Installation / Integration（安装 / 集成）
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 问题性质
      options: [BUG, CAPABILITY_GAP, USABILITY, INTEGRATION]
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: language
      description: Python / C / C++ / Java
    validations:
      required: false
  - type: textarea
    id: workload
    attributes:
      label: repository / workload
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: actual behavior
      description: 实际发生了什么（命令、输出、错误）。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: minimal reproduction
      description: 最小复现（命令 + 输入片段）。
    validations:
      required: false
  - type: input
    id: affected
    attributes:
      label: affected query / capability
      description: 例如 callers / sparse_dfg / analysis ...
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: severity
      options: [critical, high, medium, low]
    validations:
      required: false