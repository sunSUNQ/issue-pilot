name: 候选事项
description: 提交一个有证据、可证伪的新任务候选
title: "[候选] "
labels: ["status:candidate"]
body:
  - type: dropdown
    id: repository
    attributes:
      label: 目标研发线
      options: [tasco, codegraph, issue-pilot, cross-repo]
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 类型
      description: 图谱能力类型（GRAPH_* / INTEGRATION）为 ProvenLattice 主线；research 默认不进产品主线，须 Owner 单独授权。
      options: [GRAPH_FEATURE, GRAPH_QUERY, GRAPH_BUG, GRAPH_SCALE, INTEGRATION, bug, maintenance, research, decision]
    validations:
      required: true
  - type: textarea
    id: roadmap_alignment
    attributes:
      label: Roadmap Alignment
      description: 属于哪个已批准图谱能力方向（见 policies/graph-capabilities.md §3）。
    validations:
      required: true
  - type: textarea
    id: product_value
    attributes:
      label: Product Value
      description: 完成后客户能够新增使用什么能力。
    validations:
      required: true
  - type: textarea
    id: minimal_scope
    attributes:
      label: Minimal Scope
      description: 最小可交付范围是什么。
    validations:
      required: true
  - type: textarea
    id: necessity
    attributes:
      label: Necessity
      description: 必须创建新 Issue，还是属于当前 Issue 正常实现范围。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 观察证据
      description: 提供可复现事实，而不是只有解决方案猜测。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: falsification
    attributes:
      label: 反例与失败条件
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 允许修改范围
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收方式
    validations:
      required: true
